openapi: 3.0.3
info:
  title: Hydra Admin API
  description: |
    Hydra 高可用大模型聚合网关 - 管理后台 API

    提供渠道管理、日志查询、系统配置等管理功能。
  version: 1.0.0
  contact:
    name: Hydra Team

servers:
  - url: http://localhost:8080/admin/api
    description: 本地开发环境
  - url: https://api.example.com/admin/api
    description: 生产环境

security:
  - SessionAuth: []

paths:
  # ========== 认证 ==========
  /auth/login:
    post:
      summary: 管理员登录
      description: 使用用户名和密码登录,成功后返回 Session Cookie
      operationId: adminLogin
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 50
                password:
                  type: string
                  minLength: 8
            example:
              username: admin
              password: password123

      responses:
        '200':
          description: 登录成功
          headers:
            Set-Cookie:
              description: Session Cookie
              schema:
                type: string
              example: hydra_session=abc123; Path=/admin; HttpOnly; Secure; SameSite=Lax
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/AdminUser'
              example:
                message: Login successful
                user:
                  id: 1
                  username: admin
                  last_login_at: "2026-01-12T10:00:00Z"

        '401':
          description: 认证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid username or password

  /auth/logout:
    post:
      summary: 管理员登出
      operationId: adminLogout
      tags:
        - Auth
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Logout successful

  /auth/me:
    get:
      summary: 获取当前用户信息
      operationId: getCurrentUser
      tags:
        - Auth
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ========== 渠道管理 ==========
  /channels:
    get:
      summary: 获取渠道列表
      operationId: listChannels
      tags:
        - Channels
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Channel'

    post:
      summary: 创建渠道
      operationId: createChannel
      tags:
        - Channels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelInput'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '400':
          $ref: '#/components/responses/BadRequest'

  /channels/{channelId}:
    get:
      summary: 获取渠道详情
      operationId: getChannel
      tags:
        - Channels
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelDetail'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: 更新渠道
      operationId: updateChannel
      tags:
        - Channels
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelInput'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: 删除渠道
      operationId: deleteChannel
      tags:
        - Channels
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '204':
          description: 删除成功
        '404':
          $ref: '#/components/responses/NotFound'

  /channels/{channelId}/sync-models:
    post:
      summary: 同步渠道模型
      description: |
        调用渠道的 `/v1/models` 接口,计算与本地配置的差异。

        返回:
        - 新增模型(上游有,本地无)
        - 缺失模型(本地有,上游无)
        - 存量模型(两边都有)
      operationId: syncChannelModels
      tags:
        - Channels
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: 同步成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelDiff'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: 上游接口调用失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /channels/{channelId}/test-keys:
    post:
      summary: 测活渠道所有 Key
      description: 并发测试渠道所有 Key 的健康状态
      operationId: testChannelKeys
      tags:
        - Channels
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: 测试完成
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  active:
                    type: integer
                  dead:
                    type: integer
                  cooling:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/KeyTestResult'

  # ========== Key 管理 ==========
  /keys:
    post:
      summary: 添加 Key
      operationId: createKey
      tags:
        - Keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyInput'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Key'

  /keys/{keyId}:
    delete:
      summary: 删除 Key
      operationId: deleteKey
      tags:
        - Keys
      parameters:
        - $ref: '#/components/parameters/KeyId'
      responses:
        '204':
          description: 删除成功

    patch:
      summary: 重置 Key 状态
      description: 将 Dead 状态的 Key 重置为 Active
      operationId: resetKey
      tags:
        - Keys
      parameters:
        - $ref: '#/components/parameters/KeyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [reset]
      responses:
        '200':
          description: 重置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Key'

  # ========== 模型配置 ==========
  /channel-models:
    post:
      summary: 创建模型配置
      operationId: createChannelModel
      tags:
        - Models
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelModelInput'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelModel'

  /channel-models/{modelId}:
    put:
      summary: 更新模型配置
      operationId: updateChannelModel
      tags:
        - Models
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelModelInput'
      responses:
        '200':
          description: 更新成功

    delete:
      summary: 删除模型配置
      operationId: deleteChannelModel
      tags:
        - Models
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: 删除成功

  # ========== 日志查询 ==========
  /logs:
    get:
      summary: 查询请求日志
      operationId: queryLogs
      tags:
        - Logs
      parameters:
        - name: trace_id
          in: query
          schema:
            type: string
            format: uuid
        - name: start_time
          in: query
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          schema:
            type: string
            format: date-time
        - name: status_code
          in: query
          schema:
            type: integer
        - name: channel_id
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RequestLog'

  /logs/{traceId}:
    get:
      summary: 获取日志详情
      operationId: getLogDetail
      tags:
        - Logs
      parameters:
        - name: traceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestLogDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  # ========== 仪表盘 ==========
  /dashboard/metrics:
    get:
      summary: 获取仪表盘指标
      operationId: getDashboardMetrics
      tags:
        - Dashboard
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardMetrics'

  # ========== 系统设置 ==========
  /settings:
    get:
      summary: 获取系统设置
      operationId: getSettings
      tags:
        - Settings
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string

    put:
      summary: 更新系统设置
      operationId: updateSettings
      tags:
        - Settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        '200':
          description: 更新成功

  # ========== 访问令牌 ==========
  /tokens:
    get:
      summary: 获取令牌列表
      operationId: listTokens
      tags:
        - Tokens
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessToken'

    post:
      summary: 创建访问令牌
      operationId: createToken
      tags:
        - Tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
      responses:
        '201':
          description: 创建成功(仅此一次返回明文令牌)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  token:
                    type: string
                    description: 明文令牌(仅创建时返回,请妥善保存)
              example:
                id: 1
                name: My Token
                token: sk-hydra-abc123xyz

  /tokens/{tokenId}:
    delete:
      summary: 删除访问令牌
      operationId: deleteToken
      tags:
        - Tokens
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: 删除成功

components:
  securitySchemes:
    SessionAuth:
      type: apiKey
      in: cookie
      name: hydra_session
      description: Session Cookie(通过 /auth/login 获取)

  parameters:
    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        type: integer

    KeyId:
      name: keyId
      in: path
      required: true
      schema:
        type: integer

  schemas:
    AdminUser:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        last_login_at:
          type: string
          format: date-time

    Channel:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        base_url:
          type: string
        priority:
          type: integer
        weight:
          type: integer
        status:
          type: string
          enum: [Active, Cooling, Disabled]
        failure_count:
          type: integer
        last_failure_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    ChannelDetail:
      allOf:
        - $ref: '#/components/schemas/Channel'
        - type: object
          properties:
            keys:
              type: array
              items:
                $ref: '#/components/schemas/Key'
            models:
              type: array
              items:
                $ref: '#/components/schemas/ChannelModel'

    ChannelInput:
      type: object
      required:
        - name
        - base_url
      properties:
        name:
          type: string
        base_url:
          type: string
        priority:
          type: integer
          default: 100
        weight:
          type: integer
          default: 100

    Key:
      type: object
      properties:
        id:
          type: integer
        channel_id:
          type: integer
        key_value:
          type: string
          description: API Key(完整显示,不脱敏)
        status:
          type: string
          enum: [Active, Dead, Cooling, HalfOpen]
        failure_count:
          type: integer
        last_failure_at:
          type: string
          format: date-time
        last_success_at:
          type: string
          format: date-time

    KeyInput:
      type: object
      required:
        - channel_id
        - key_value
      properties:
        channel_id:
          type: integer
        key_value:
          type: string

    KeyTestResult:
      type: object
      properties:
        key_id:
          type: integer
        status:
          type: string
          enum: [Active, Dead]
        latency_ms:
          type: integer
        error:
          type: string

    ChannelModel:
      type: object
      properties:
        id:
          type: integer
        channel_id:
          type: integer
        upstream_model:
          type: string
        unified_model:
          type: string
        enabled:
          type: boolean
        weight:
          type: integer

    ChannelModelInput:
      type: object
      required:
        - channel_id
        - upstream_model
        - unified_model
      properties:
        channel_id:
          type: integer
        upstream_model:
          type: string
        unified_model:
          type: string
        enabled:
          type: boolean
          default: true
        weight:
          type: integer
          default: 100

    ModelDiff:
      type: object
      properties:
        new_models:
          type: array
          items:
            type: string
          description: 上游有,本地无
        missing_models:
          type: array
          items:
            type: string
          description: 本地有,上游无
        existing_models:
          type: array
          items:
            type: string
          description: 两边都有

    RequestLog:
      type: object
      properties:
        id:
          type: integer
        trace_id:
          type: string
          format: uuid
        request_time:
          type: string
          format: date-time
        client_ip:
          type: string
        requested_model:
          type: string
        actual_model:
          type: string
        channel_id:
          type: integer
        status_code:
          type: integer
        duration_ms:
          type: integer
        error_message:
          type: string
        is_fake_success:
          type: boolean

    RequestLogDetail:
      allOf:
        - $ref: '#/components/schemas/RequestLog'
        - type: object
          properties:
            channel_name:
              type: string
            key_value:
              type: string

    DashboardMetrics:
      type: object
      properties:
        qps:
          type: array
          items:
            type: object
            properties:
              timestamp:
                type: integer
              value:
                type: number
        success_rate:
          type: number
          format: float
        channel_health:
          type: array
          items:
            type: object
            properties:
              channel_id:
                type: integer
              channel_name:
                type: string
              status:
                type: string
              active_keys:
                type: integer
              total_keys:
                type: integer

    AccessToken:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        enabled:
          type: boolean
        last_used_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: string

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
