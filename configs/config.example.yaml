# Hydra Configuration Example

server:
  port: 8080                                                                            # HTTP 服务端口
  read_timeout: 60s                                                                     # 读取超时
  write_timeout: 60s                                                                    # 写入超时
  max_header_bytes: 1048576                                                             # 最大 Header 大小 (1MB)

database:
  type: postgres                                                                        # 数据库类型: sqlite | postgres
  #sqlite_path: ./data/hydra.db                                                         # SQLite 数据库文件路径
  #postgres_dsn: "postgresql://postgres:wvnkwbg6@43.134.241.241:8922/hydra"              # PostgreSQL 连接字符串(当 type=postgres 时使用)
  postgres_dsn: "postgresql://postgres:123456@127.0.0.1/hydra"
  max_open_conns: 10                                                                    # 最大打开连接数
  max_idle_conns: 5                                                                     # 最大空闲连接数
  conn_max_lifetime: 300s                                                               # 连接最大生命周期

log:
  level: info                                                                           # 日志级别: debug | info | warn | error
  retention_days: 30                                                                    # 审计日志保留天数
  debug_enabled: false                                                                  # 是否启用调试日志(记录完整 Request/Response Body)
  add_source: true                                                                      # 是否记录源文件
  file:
    enabled: true                                                                       # 是否启用文件日志
    path: ./data/logs/hydra.log                                                         # 日志文件路径
    max_size: 100                                                                       # 单个日志文件最大大小(MB)
    max_backups: 10                                                                     # 保留的日志文件数量
    max_age: 0                                                                          # 日志文件保留天数(0 表示不按天数清理)
    compress: true                                                                      # 是否压缩旧日志文件
